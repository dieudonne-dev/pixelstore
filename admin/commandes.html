<!DOCTYPE html>
<html lang="fr" data-theme="light">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Commandes — PixelStore Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="css/admin.css">
  </head>
  <body>

    <script src="js/admin-config.js"></script>
    <script src="js/admin-supabase.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/admin.js"></script>

    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const content = renderAdminLayout('commandes');

        let currentFilter = 'all';
        let orders = [];

        content.innerHTML = `
          <div class="page-breadcrumb">
            <a href="index.html">${ICONS.home} Tableau de bord</a>
            <span>/</span>
            <span>Commandes</span>
          </div>

          <div class="page-header">
            <div>
              <h1 class="page-title">Commandes</h1>
              <p class="page-subtitle">Suivez et gérez les commandes de vos clients.</p>
            </div>
          </div>

          <div class="kpi-chips">
            <button class="kpi-chip active" data-filter="all">Toutes <span class="chip-count" id="chipAll">0</span></button>
            <button class="kpi-chip" data-filter="pending">En attente</button>
            <button class="kpi-chip" data-filter="processing">En traitement</button>
            <button class="kpi-chip" data-filter="shipped">Expédiées</button>
            <button class="kpi-chip" data-filter="delivered">Livrées</button>
            <button class="kpi-chip" data-filter="cancelled">Annulées</button>
          </div>

          <div class="toolbar">
            <div class="search-input">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
              <input type="text" id="searchInput" placeholder="Rechercher une commande, un client...">
            </div>
            <select class="select-filter" id="paymentFilter">
              <option value="all">Tous les paiements</option>
              <option value="paid">Payé</option>
              <option value="pending">En attente</option>
              <option value="refunded">Remboursé</option>
            </select>
          </div>

          <div class="table-wrapper">
            <table class="admin-table">
              <thead>
                <tr>
                  <th>N° commande</th>
                  <th>Client</th>
                  <th>Date</th>
                  <th>Articles</th>
                  <th>Total</th>
                  <th>Paiement</th>
                  <th>Statut</th>
                  <th style="text-align:right">Action</th>
                </tr>
              </thead>
              <tbody id="ordersBody"></tbody>
            </table>
          </div>

          <div class="modal-backdrop" id="orderModal">
            <div class="modal">
              <div class="modal-header">
                <h3 id="modalTitle">Détail de la commande</h3>
                <button class="modal-close" id="modalClose" aria-label="Fermer">
                  <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
              </div>
              <div id="modalBody"></div>
            </div>
          </div>
        `;

        const tbody = document.getElementById('ordersBody');
        const searchInput = document.getElementById('searchInput');
        const paymentFilter = document.getElementById('paymentFilter');
        const modal = document.getElementById('orderModal');

        function methodLabel(m) {
          const map = { card: 'Carte bancaire', paypal: 'PayPal', cod: 'Paiement à la livraison', bank_transfer: 'Virement', mobile_money: 'Mobile Money' };
          return map[m] || (m ? String(m).replace('_', ' ') : '—');
        }

        function renderOrders() {
          let list = [...orders];
          if (currentFilter !== 'all') list = list.filter(o => o.status === currentFilter);
          const q = searchInput.value.toLowerCase();
          if (q) {
            list = list.filter(o => {
              const email = (o.user && o.user.email) || '';
              return o.order_number.toLowerCase().includes(q) || email.toLowerCase().includes(q);
            });
          }
          const pay = paymentFilter.value;
          if (pay !== 'all') list = list.filter(o => o.payment_status === pay);

          if (list.length === 0) {
            tbody.innerHTML = `
              <tr><td colspan="8">
                <div class="empty-state">
                  <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path><line x1="3" y1="6" x2="21" y2="6"></line></svg>
                  <h3>Aucune commande</h3>
                  <p>Aucune commande ne correspond à ces critères.</p>
                </div>
              </td></tr>`;
            return;
          }

          tbody.innerHTML = list.map(o => {
            const st = orderStatusMap[o.status] || orderStatusMap.pending;
            const pay = paymentStatusMap[o.payment_status] || paymentStatusMap.pending;
            const email = (o.user && o.user.email) || '—';
            const nArticles = (o.items || []).reduce((s, i) => s + i.quantity, 0);
            return `
              <tr>
                <td class="price-text" style="color:var(--accent-green)">${o.order_number}</td>
                <td><strong style="font-size:0.88rem">${email}</strong><br><span style="font-size:0.76rem;color:var(--text-secondary)">${email}</span></td>
                <td style="color:var(--text-secondary)">${formatDate(o.created_at)}</td>
                <td>${nArticles} article(s)</td>
                <td class="price-text">${formatPrice(o.grand_total)}</td>
                <td><span class="badge ${pay.badge}">${pay.label}</span></td>
                <td><span class="badge ${st.badge}">${st.label}</span></td>
                <td><button class="btn btn-secondary btn-sm btn-view" data-id="${o.id}">Détails</button></td>
              </tr>
            `;
          }).join('');
        }

        async function openOrderModal(order) {
          const st = orderStatusMap[order.status] || orderStatusMap.pending;
          const pay = paymentStatusMap[order.payment_status] || paymentStatusMap.pending;
          const u = order.user || {};
          const fullName = [u.first_name, u.last_name].filter(Boolean).join(' ') || u.email || 'Client';
          const phone = u.phone || '';

          let addresses = [];
          try { addresses = await adminDB.addressesByUser(order.user_id); } catch (e) { /* ignore */ }
          const shipping = addresses.find(a => a.type === 'shipping') || addresses[0] || null;
          const billing = addresses.find(a => a.type === 'billing') || null;

          function fmtAddr(a) {
            if (!a) return '<span style="color:var(--text-secondary)">Aucune adresse renseignée</span>';
            const lines = [a.address_line1, a.address_line2].filter(Boolean);
            const cityLine = [a.city, a.province].filter(Boolean).join(', ');
            if (cityLine) lines.push(cityLine);
            if (a.country) lines.push(a.country);
            const aPhone = a.phone || phone;
            return lines.map(l => '<div>' + l + '</div>').join('') + (aPhone ? '<div style="margin-top:4px;color:var(--text-secondary);font-size:0.82rem">' + aPhone + '</div>' : '');
          }

          const statusOptions = Object.keys(orderStatusMap)
            .filter(s => s !== 'confirmed')
            .map(s => `<option value="${s}" ${s === order.status ? 'selected' : ''}>${orderStatusMap[s].label}</option>`)
            .join('');

          document.getElementById('modalTitle').textContent = 'Détail — ' + order.order_number;
          document.getElementById('modalBody').innerHTML = `
            <div class="detail-panel">
              <div class="card" style="margin-bottom:16px">
                <div class="card-header">
                  <h4 style="font-size:0.9rem">Changement de statut</h4>
                </div>
                <div style="display:flex;gap:12px;align-items:flex-end">
                  <div class="form-group" style="flex:1">
                    <label>Statut de la commande</label>
                    <select id="orderStatusSelect">${statusOptions}</select>
                  </div>
                  <button class="btn btn-primary btn-sm" id="updateStatusBtn">Mettre à jour</button>
                </div>
              </div>

              <div class="card" style="margin-bottom:16px">
                <div class="card-header"><h4>Informations client</h4></div>
                <div style="display:flex;gap:14px;align-items:center;margin-bottom:14px">
                  <div class="aside-row" style="border:none;padding:0">
                    <div class="customer-avatar">${initials(fullName)}</div>
                    <div>
                      <p><strong>${fullName}</strong></p>
                      <span>${u.email || '—'}</span>
                    </div>
                  </div>
                </div>
                <div class="detail-section">
                  <div style="display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between">
                    <div><strong style="font-size:0.8rem;color:var(--text-secondary)">Téléphone</strong><br><span>${phone || '—'}</span></div>
                    <div><strong style="font-size:0.8rem;color:var(--text-secondary)">Paiement</strong><br><span class="badge ${pay.badge}">${pay.label}</span></div>
                    <div><strong style="font-size:0.8rem;color:var(--text-secondary)">Méthode</strong><br><span>${methodLabel(order.payment_method)}</span></div>
                    <div><strong style="font-size:0.8rem;color:var(--text-secondary)">Date</strong><br><span>${formatDateTime(order.created_at)}</span></div>
                  </div>
                </div>
              </div>

              ${addresses.length ? `
              <div class="card" style="margin-bottom:16px">
                <div class="card-header"><h4>Adresse(s)</h4></div>
                <div style="display:flex;gap:20px;flex-wrap:wrap">
                  <div style="flex:1;min-width:180px">
                    <strong style="font-size:0.8rem;color:var(--text-secondary)">Livraison</strong>
                    <div style="margin-top:4px;font-size:0.88rem;line-height:1.5">${fmtAddr(shipping)}</div>
                  </div>
                  ${billing ? `
                  <div style="flex:1;min-width:180px">
                    <strong style="font-size:0.8rem;color:var(--text-secondary)">Facturation</strong>
                    <div style="margin-top:4px;font-size:0.88rem;line-height:1.5">${fmtAddr(billing)}</div>
                  </div>
                  ` : ''}
                </div>
              </div>
              ` : ''}

              ${order.customer_notes ? `
              <div class="card" style="margin-bottom:16px">
                <div class="card-header"><h4>Notes du client</h4></div>
                <p style="font-size:0.88rem;color:var(--text-secondary);margin:0">${order.customer_notes}</p>
              </div>
              ` : ''}

              <div class="card">
                <div class="card-header"><h4>Articles commandés</h4></div>
                <div class="table-wrapper" style="border:none">
                  <table class="admin-table">
                    <thead><tr><th>Produit</th><th>Qté</th><th>Prix</th><th style="text-align:right">Sous-total</th></tr></thead>
                    <tbody>
                      ${(order.items || []).map(i => `
                        <tr>
                          <td>${i.product_name}</td>
                          <td>${i.quantity}</td>
                          <td>${formatPrice(i.unit_price)}</td>
                          <td style="text-align:right" class="price-text">${formatPrice(i.unit_price * i.quantity)}</td>
                        </tr>
                      `).join('')}
                    </tbody>
                  </table>
                </div>
                <div style="display:flex;flex-direction:column;gap:8px;margin-top:16px;margin-left:auto;max-width:280px">
                  <div style="display:flex;justify-content:space-between"><span style="color:var(--text-secondary)">Sous-total</span><span>${formatPrice(order.subtotal)}</span></div>
                  <div style="display:flex;justify-content:space-between"><span style="color:var(--text-secondary)">Remise</span><span>${formatPrice(order.discount_total || 0)}</span></div>
                  <div style="display:flex;justify-content:space-between"><span style="color:var(--text-secondary)">Livraison</span><span>${formatPrice(order.shipping_cost || 0)}</span></div>
                  <div style="display:flex;justify-content:space-between;border-top:1px solid var(--border-color);padding-top:8px"><strong>Total</strong><strong class="price-text">${formatPrice(order.grand_total)}</strong></div>
                </div>
              </div>
            </div>
          `;

          modal.classList.add('open');

          document.getElementById('updateStatusBtn').addEventListener('click', async () => {
            const newStatus = document.getElementById('orderStatusSelect').value;
            const btn = document.getElementById('updateStatusBtn');
            btn.disabled = true;
            try {
              await adminDB.updateOrderStatus(order.id, newStatus);
              order.status = newStatus;
              showToast('Statut de la commande mis à jour.');
              modal.classList.remove('open');
              renderOrders();
            } catch (err) {
              btn.disabled = false;
              showToast((err && err.message) || 'Recherchez le schéma supabase_schema.sql dans Supabase, puis réessayez.', 'error');
            }
          });
        }

        tbody.addEventListener('click', (e) => {
          const btn = e.target.closest('.btn-view');
          if (!btn) return;
          const order = orders.find(o => o.id === btn.dataset.id);
          if (order) openOrderModal(order);
        });

        searchInput.addEventListener('input', renderOrders);
        paymentFilter.addEventListener('change', renderOrders);

        content.querySelectorAll('.kpi-chip').forEach(chip => {
          chip.addEventListener('click', () => {
            content.querySelectorAll('.kpi-chip').forEach(c => c.classList.remove('active'));
            chip.classList.add('active');
            currentFilter = chip.dataset.filter;
            renderOrders();
          });
        });

        document.getElementById('modalClose').addEventListener('click', () => modal.classList.remove('open'));
        modal.addEventListener('click', (e) => { if (e.target === modal) modal.classList.remove('open'); });
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') modal.classList.remove('open'); });

        async function load() {
          orders = await adminDB.orders();
          document.getElementById('chipAll').textContent = orders.length;
          renderOrders();
          const urlId = new URLSearchParams(window.location.search).get('id');
          if (urlId) {
            const target = orders.find(o => String(o.id) === String(urlId));
            if (target) openOrderModal(target);
            history.replaceState(null, '', window.location.pathname);
          }
        }

        adminGate(content, load);
      });
    </script>

  </body>
</html>
