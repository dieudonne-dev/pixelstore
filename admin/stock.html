<!DOCTYPE html>
<html lang="fr" data-theme="light">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock — PixelStore Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="css/admin.css">
  </head>
  <body>

    <script src="js/admin-config.js"></script>
    <script src="js/admin-supabase.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/admin.js"></script>

    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const content = renderAdminLayout('stock');

        const defaultThreshold = 5;
        let currentFilter = 'all';
        let products = [];
        let categories = [];

        content.innerHTML = `
          <div class="page-breadcrumb">
            <a href="index.html">${ICONS.home} Tableau de bord</a>
            <span>/</span>
            <span>Stock</span>
          </div>

          <div class="page-header">
            <div>
              <h1 class="page-title">Gestion du stock</h1>
              <p class="page-subtitle">Suivez la disponibilité des produits et ajustez les quantités.</p>
            </div>
            <button class="btn btn-primary" id="openMovementBtn">+ Ajuster le stock</button>
          </div>

          <div class="kpi-chips" id="stockChips">
            <button class="kpi-chip active" data-filter="all">Tous <span class="chip-count" id="chipAll"></span></button>
            <button class="kpi-chip" data-filter="low">Stock faible</button>
            <button class="kpi-chip" data-filter="out">En rupture</button>
            <button class="kpi-chip" data-filter="in">Disponible</button>
          </div>

          <div class="toolbar">
            <div class="search-input">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
              <input type="text" id="searchInput" placeholder="Rechercher un produit...">
            </div>
            <button class="btn btn-secondary btn-sm" id="exportBtn">
              <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
              Exporter CSV
            </button>
          </div>

          <div class="table-wrapper">
            <table class="admin-table">
              <thead>
                <tr>
                  <th>Produit</th>
                  <th>Catégorie</th>
                  <th>Réf.</th>
                  <th>Quantité</th>
                  <th>Disponible</th>
                  <th>Statut</th>
                  <th style="text-align:right">Actions</th>
                </tr>
              </thead>
              <tbody id="stockBody"></tbody>
            </table>
          </div>

          <div class="modal-backdrop" id="stockModal">
            <div class="modal">
              <div class="modal-header">
                <h3 id="stockModalTitle">Ajustement de stock</h3>
                <button class="modal-close" id="stockModalClose" aria-label="Fermer">
                  <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
              </div>
              <div id="stockModalBody"></div>
            </div>
          </div>
        `;

        const tbody = document.getElementById('stockBody');
        const searchInput = document.getElementById('searchInput');
        const modal = document.getElementById('stockModal');

        function stockLevel(p) {
          const thr = p.stockThreshold || defaultThreshold;
          if (p.stock <= 0) return 'out';
          if (p.stock <= thr) return 'low';
          return 'in';
        }

        function renderStock() {
          let list = products;
          if (currentFilter === 'low') list = list.filter(p => p.stock > 0 && p.stock <= (p.stockThreshold || defaultThreshold));
          if (currentFilter === 'out') list = list.filter(p => p.stock <= 0);
          if (currentFilter === 'in') list = list.filter(p => p.stock > (p.stockThreshold || defaultThreshold));
          const q = searchInput.value.toLowerCase();
          if (q) {
            list = list.filter(p =>
              p.name.toLowerCase().includes(q) ||
              p.reference.toLowerCase().includes(q) ||
              (p.brand && p.brand.toLowerCase().includes(q))
            );
          }

          if (list.length === 0) {
            tbody.innerHTML = `
              <tr><td colspan="7">
                <div class="empty-state">
                  <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path></svg>
                  <h3>Aucun produit trouvé</h3>
                  <p>Modifiez vos filtres ou votre recherche.</p>
                </div>
              </td></tr>`;
            return;
          }

          tbody.innerHTML = list.map(p => {
            const cat = categories.find(c => c.slug === p.category);
            const lvl = stockLevel(p);
            const statusBadge = lvl === 'out'
              ? '<span class="badge badge-red">En rupture</span>'
              : lvl === 'low'
                ? '<span class="badge badge-amber">Stock faible</span>'
                : '<span class="badge badge-green">Disponible</span>';
            const pct = Math.min(100, Math.round((p.stock / 30) * 100));
            return `
              <tr>
                <td>
                  <div class="table-product">
                    ${p.image
                      ? `<img src="${window.adminResolveImage(p.image)}" alt="${p.name}">`
                      : '<div class="prod-thumb placeholder"><span>N/A</span></div>'}
                    <div>
                      <strong>${p.name}</strong>
                      <span>${p.brand}</span>
                    </div>
                  </div>
                </td>
                <td>${cat ? cat.name : p.categoryName || p.category}</td>
                <td>${p.reference}</td>
                <td>
                  <div style="min-width:130px">
                    <div style="display:flex;justify-content:space-between;font-size:0.8rem;margin-bottom:4px">
                      <strong>${p.stock} u.</strong>
                      <span style="color:var(--text-secondary)">seuil ${p.stockThreshold || defaultThreshold}</span>
                    </div>
                    <div style="height:6px;background:var(--bg-primary);border-radius:999px">
                      <div style="height:100%;border-radius:999px;width:${pct}%;background:${lvl === 'out' ? 'var(--accent-red)' : lvl === 'low' ? '#F59E0B' : 'var(--accent-green)'}"></div>
                    </div>
                  </div>
                </td>
                <td class="price-text">${p.stock}</td>
                <td>${statusBadge}</td>
                <td>
                  <div style="display:flex;gap:6px;justify-content:flex-end">
                    <button class="btn btn-secondary btn-icon btn-adjust" data-id="${p.id}" title="Ajuster le stock" aria-label="Ajuster le stock">
                      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"></path><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"></path></svg>
                    </button>
                  </div>
                </td>
              </tr>
            `;
          }).join('');
        }

        function openStockModal(product) {
          document.getElementById('stockModalTitle').textContent = 'Ajuster — ' + product.name;
          const lvl = stockLevel(product);
          document.getElementById('stockModalBody').innerHTML = `
            <div class="detail-panel">
              <div class="aside-row">
                ${product.image
                  ? `<img src="${window.adminResolveImage(product.image)}" alt="${product.name}" style="width:64px;height:64px;border-radius:10px;object-fit:cover">`
                  : '<div class="prod-thumb placeholder" style="width:64px;height:64px;border-radius:10px;font-size:12px"><span>N/A</span></div>'}
                <div>
                  <p><strong>${product.name}</strong></p>
                  <span>${product.reference} • ${formatPrice(product.price)}</span>
                </div>
              </div>

              <div class="card" style="margin-top:16px">
                <div class="card-header"><h4 style="font-size:0.9rem">État actuel</h4></div>
                <div style="display:flex;gap:24px;flex-wrap:wrap">
                  <div>
                    <span style="font-size:0.78rem;color:var(--text-secondary)">Quantité en stock</span><br>
                    <strong style="font-size:1.2rem">${product.stock} u.</strong>
                  </div>
                  <div>
                    <span style="font-size:0.78rem;color:var(--text-secondary)">Statut</span><br>
                    ${lvl === 'out' ? '<span class="badge badge-red">En rupture</span>' : lvl === 'low' ? '<span class="badge badge-amber">Stock faible</span>' : '<span class="badge badge-green">Disponible</span>'}
                  </div>
                </div>
              </div>

              <div class="card" style="margin-top:16px">
                <div class="card-header"><h4 style="font-size:0.9rem">Nouvelle quantité</h4></div>
                <div class="form-group" style="margin-bottom:14px">
                  <label for="newQty">Quantité</label>
                  <input type="number" id="newQty" value="${product.stock}" min="0" step="1">
                </div>
                <div style="display:flex;gap:8px;flex-wrap:wrap">
                  <button type="button" class="btn btn-secondary btn-sm" data-add="-1">− 1</button>
                  <button type="button" class="btn btn-secondary btn-sm" data-add="1">+ 1</button>
                  <button type="button" class="btn btn-secondary btn-sm" data-add="5">+ 5</button>
                  <button type="button" class="btn btn-secondary btn-sm" data-add="10">+ 10</button>
                </div>
              </div>

              <div class="form-actions">
                <button class="btn btn-ghost" id="cancelStock">Annuler</button>
                <button class="btn btn-primary" id="saveStock">Enregistrer</button>
              </div>
            </div>
          `;

          modal.classList.add('open');

          const qtyInput = document.getElementById('newQty');
          modal.querySelectorAll('[data-add]').forEach(btn => {
            btn.addEventListener('click', () => {
              const cur = parseInt(qtyInput.value, 10) || 0;
              qtyInput.value = Math.max(0, cur + parseInt(btn.dataset.add, 10));
            });
          });

          document.getElementById('cancelStock').addEventListener('click', () => modal.classList.remove('open'));
          document.getElementById('saveStock').addEventListener('click', async () => {
            const newQty = Math.max(0, parseInt(qtyInput.value, 10) || 0);
            const btn = document.getElementById('saveStock');
            btn.disabled = true;
            try {
              await adminDB.updateStock(product.id, newQty);
              await load();
              showToast('Stock de « ' + product.name + ' » mis à jour.');
            } catch (err) {
              btn.disabled = false;
              showToast((err && err.message) || 'Erreur lors de la mise à jour.', 'error');
            }
            modal.classList.remove('open');
          });
        }

        tbody.addEventListener('click', (e) => {
          const btn = e.target.closest('.btn-adjust');
          if (!btn) return;
          const product = products.find(p => p.id === parseInt(btn.dataset.id, 10));
          if (product) openStockModal(product);
        });

        content.querySelectorAll('#stockChips .kpi-chip').forEach(chip => {
          chip.addEventListener('click', () => {
            content.querySelectorAll('#stockChips .kpi-chip').forEach(c => c.classList.remove('active'));
            chip.classList.add('active');
            currentFilter = chip.dataset.filter;
            renderStock();
          });
        });

        searchInput.addEventListener('input', renderStock);

        document.getElementById('openMovementBtn').addEventListener('click', () => {
          if (products.length === 0) { showToast('Aucun produit disponible.', 'warning'); return; }
          openStockModal(products[0]);
        });

        document.getElementById('exportBtn').addEventListener('click', () => {
          let list = products;
          if (currentFilter === 'low') list = list.filter(p => p.stock > 0 && p.stock <= (p.stockThreshold || defaultThreshold));
          if (currentFilter === 'out') list = list.filter(p => p.stock <= 0);
          if (currentFilter === 'in') list = list.filter(p => p.stock > (p.stockThreshold || defaultThreshold));
          const q = searchInput.value.toLowerCase();
          if (q) {
            list = list.filter(p =>
              p.name.toLowerCase().includes(q) ||
              p.reference.toLowerCase().includes(q) ||
              (p.brand && p.brand.toLowerCase().includes(q))
            );
          }

          const rows = [['Produit', 'Catégorie', 'Référence', 'Quantité (u.)', 'Disponible', 'Statut']];
          list.forEach(p => {
            const cat = categories.find(c => c.slug === p.category);
            const lvl = stockLevel(p);
            rows.push([
              p.name,
              cat ? cat.name : (p.categoryName || p.category),
              p.reference,
              p.stock,
              p.stock,
              lvl === 'out' ? 'En rupture' : lvl === 'low' ? 'Stock faible' : 'Disponible'
            ]);
          });
          const csv = rows.map(r => r.map(c => '"' + String(c).replace(/"/g, '""') + '"').join(',')).join('\r\n');
          const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = 'stock_pixelstore.csv';
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          setTimeout(() => URL.revokeObjectURL(url), 1000);
          showToast('Stock exporté en CSV (' + list.length + ' ligne' + (list.length > 1 ? 's' : '') + ').');
        });

        document.getElementById('stockModalClose').addEventListener('click', () => modal.classList.remove('open'));
        modal.addEventListener('click', (e) => { if (e.target === modal) modal.classList.remove('open'); });
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') modal.classList.remove('open'); });

        async function load() {
          products = await adminDB.products();
          categories = await adminDB.categories();
          document.getElementById('chipAll').textContent = products.length;
          renderStock();
        }

        adminGate(content, load);
      });
    </script>

  </body>
</html>
