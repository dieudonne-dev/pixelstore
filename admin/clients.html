<!DOCTYPE html>
<html lang="fr" data-theme="light">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clients — PixelStore Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="css/admin.css">
  </head>
  <body>

    <script src="js/admin-config.js"></script>
    <script src="js/admin-supabase.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/admin.js"></script>

    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const content = renderAdminLayout('clients');

        let customers = [];
        let orders = [];

        content.innerHTML = `
          <div class="page-breadcrumb">
            <a href="index.html">${ICONS.home} Tableau de bord</a>
            <span>/</span>
            <span>Clients</span>
          </div>

          <div class="page-header">
            <div>
              <h1 class="page-title">Clients</h1>
              <p class="page-subtitle" id="clientsCount">Chargement…</p>
            </div>
          </div>

          <div class="toolbar">
            <div class="search-input">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
              <input type="text" id="searchInput" placeholder="Rechercher un client (nom, email)...">
            </div>
          </div>

          <div class="table-wrapper">
            <table class="admin-table">
              <thead>
                <tr>
                  <th>Client</th>
                  <th>Contact</th>
                  <th>Commandes</th>
                  <th>Total dépensé</th>
                  <th>Rôle</th>
                  <th>Inscrit le</th>
                </tr>
              </thead>
              <tbody id="customersBody"></tbody>
            </table>
          </div>
        `;

        const tbody = document.getElementById('customersBody');
        const searchInput = document.getElementById('searchInput');

        function customerName(c) {
          const full = [c.first_name, c.last_name].filter(Boolean).join(' ').trim();
          return full || (c.email ? c.email.split('@')[0] : '—');
        }

        function renderCustomers() {
          const q = searchInput.value.toLowerCase();
          let list = customers;
          if (q) {
            list = list.filter(c => {
              const name = customerName(c).toLowerCase();
              return name.includes(q) || (c.email || '').toLowerCase().includes(q);
            });
          }

          if (list.length === 0) {
            tbody.innerHTML = `
              <tr><td colspan="6">
                <div class="empty-state">
                  <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle></svg>
                  <h3>Aucun client</h3>
                  <p>Aucun client ne correspond à ces critères.</p>
                </div>
              </td></tr>`;
            return;
          }

          tbody.innerHTML = list.map(c => {
            const cOrders = orders.filter(o => o.user_id === c.id);
            const spent = cOrders.reduce((s, o) => s + (Number(o.grand_total) || 0), 0);
            return `
              <tr>
                <td>
                  <div style="display:flex;align-items:center;gap:12px">
                    <div class="avatar" style="width:38px;height:38px;font-size:0.8rem">${initials(customerName(c))}</div>
                    <strong style="font-size:0.9rem">${customerName(c)}</strong>
                  </div>
                </td>
                <td>
                  <span style="font-size:0.85rem">${c.email || '—'}</span><br>
                  <span style="font-size:0.78rem;color:var(--text-secondary)">${c.phone || ''}</span>
                </td>
                <td>${cOrders.length}</td>
                <td class="price-text">${cOrders.length ? formatPrice(spent) : '—'}</td>
                <td>${c.role === 'admin' ? '<span class="badge badge-violet">Admin</span>' : '<span class="badge badge-green">Client</span>'}</td>
                <td style="color:var(--text-secondary)">${formatDate(c.created_at)}</td>
              </tr>
            `;
          }).join('');
        }

        searchInput.addEventListener('input', renderCustomers);

        async function load() {
          customers = await adminDB.customers();
          orders = await adminDB.orders();
          document.getElementById('clientsCount').textContent = `${customers.length} clients inscrits sur votre boutique.`;
          renderCustomers();
        }

        adminGate(content, load);
      });
    </script>

  </body>
</html>
