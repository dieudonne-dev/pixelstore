<!DOCTYPE html>
<html lang="fr" data-theme="light">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clients — PixelStore Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="css/admin.css">
  </head>
  <body>

    <script src="js/layout.js"></script>
    <script src="js/admin.js"></script>

    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const content = renderAdminLayout('clients');

        let currentStatus = 'all';

        content.innerHTML = `
          <div class="page-breadcrumb">
            <a href="index.html">${ICONS.home} Tableau de bord</a>
            <span>/</span>
            <span>Clients</span>
          </div>

          <div class="page-header">
            <div>
              <h1 class="page-title">Clients</h1>
              <p class="page-subtitle">${adminCustomers.length} clients inscrits sur votre boutique.</p>
            </div>
          </div>

          <div class="kpi-chips">
            <button class="kpi-chip active" data-filter="all">Tous <span class="chip-count">${adminCustomers.length}</span></button>
            <button class="kpi-chip" data-filter="active">Actifs</button>
            <button class="kpi-chip" data-filter="pending">En attente</button>
          </div>

          <div class="toolbar">
            <div class="search-input">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
              <input type="text" id="searchInput" placeholder="Rechercher un client (nom, email, ville)...">
            </div>
          </div>

          <div class="table-wrapper">
            <table class="admin-table">
              <thead>
                <tr>
                  <th>Client</th>
                  <th>Contact</th>
                  <th>Ville</th>
                  <th>Commandes</th>
                  <th>Total dépensé</th>
                  <th>Inscrit le</th>
                  <th>Statut</th>
                </tr>
              </thead>
              <tbody id="customersBody"></tbody>
            </table>
          </div>
        `;

        const tbody = document.getElementById('customersBody');
        const searchInput = document.getElementById('searchInput');

        function renderCustomers() {
          let list = adminCustomers;
          if (currentStatus !== 'all') list = list.filter(c => c.status === currentStatus);
          const q = searchInput.value.toLowerCase();
          if (q) {
            list = list.filter(c =>
              c.name.toLowerCase().includes(q) ||
              c.email.toLowerCase().includes(q) ||
              c.city.toLowerCase().includes(q)
            );
          }

          if (list.length === 0) {
            tbody.innerHTML = `
              <tr><td colspan="7">
                <div class="empty-state">
                  <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle></svg>
                  <h3>Aucun client</h3>
                  <p>Aucun client ne correspond à ces critères.</p>
                </div>
              </td></tr>`;
            return;
          }

          tbody.innerHTML = list.map(c => `
            <tr>
              <td>
                <div style="display:flex;align-items:center;gap:12px">
                  <div class="avatar" style="width:38px;height:38px;font-size:0.8rem">${initials(c.name)}</div>
                  <strong style="font-size:0.9rem">${c.name}</strong>
                </div>
              </td>
              <td>
                <span style="font-size:0.85rem">${c.email}</span><br>
                <span style="font-size:0.78rem;color:var(--text-secondary)">${c.phone}</span>
              </td>
              <td>${c.city}</td>
              <td>${c.orders}</td>
              <td class="price-text">${c.spent ? formatPrice(c.spent) : '—'}</td>
              <td style="color:var(--text-secondary)">${formatDate(c.joined)}</td>
              <td>
                ${c.status === 'active'
                  ? '<span class="badge badge-green">Actif</span>'
                  : '<span class="badge badge-amber">En attente</span>'}
              </td>
            </tr>
          `).join('');
        }

        searchInput.addEventListener('input', renderCustomers);
        content.querySelectorAll('.kpi-chip').forEach(chip => {
          chip.addEventListener('click', () => {
            content.querySelectorAll('.kpi-chip').forEach(c => c.classList.remove('active'));
            chip.classList.add('active');
            currentStatus = chip.dataset.filter;
            renderCustomers();
          });
        });

        renderCustomers();
      });
    </script>

  </body>
</html>
