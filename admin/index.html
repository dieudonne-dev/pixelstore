<!DOCTYPE html>
<html lang="fr" data-theme="light">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tableau de bord — PixelStore Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="css/admin.css">
  </head>
  <body>

    <script src="js/admin-config.js"></script>
    <script src="js/admin-supabase.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/admin.js"></script>

    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const content = renderAdminLayout('index');

        let stats = {};
        let orders = [];
        let products = [];

        content.innerHTML = `
          <div class="page-breadcrumb">
            <a href="../index.html">${ICONS.home} Accueil</a>
            <span>/</span>
            <span>Tableau de bord</span>
          </div>

          <div class="page-header">
            <div>
              <h1 class="page-title">Bonjour, Admin 👋</h1>
              <p class="page-subtitle">Voici un aperçu de votre boutique en date du <strong>${new Date().toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })}</strong>.</p>
            </div>
            <a href="produits.html" class="btn btn-primary">+ Nouveau produit</a>
          </div>

          <div class="stat-grid">
            <div class="stat-card">
              <div class="stat-icon green">${ICONS.store}</div>
              <div>
                <div class="stat-value" id="statRevenue">—</div>
                <div class="stat-label">Chiffre d'affaires</div>
              </div>
            </div>
            <div class="stat-card">
              <div class="stat-icon blue">${ICONS.orders}</div>
              <div>
                <div class="stat-value" id="statOrders">—</div>
                <div class="stat-label">Commandes</div>
              </div>
            </div>
            <div class="stat-card">
              <div class="stat-icon orange">${ICONS.products}</div>
              <div>
                <div class="stat-value" id="statProducts">—</div>
                <div class="stat-label">Produits actifs</div>
              </div>
            </div>
            <div class="stat-card">
              <div class="stat-icon red">${ICONS.customers}</div>
              <div>
                <div class="stat-value" id="statCustomers">—</div>
                <div class="stat-label">Clients</div>
              </div>
            </div>
          </div>

          <div class="dashboard-grid">
            <div class="card">
              <div class="card-header">
                <div>
                  <h3 class="card-title">Statuts des commandes</h3>
                  <p class="card-subtitle">Répartition par statut</p>
                </div>
              </div>
              <div class="status-list" id="orderStatusList"></div>
            </div>

            <div class="card">
              <div class="card-header">
                <div>
                  <h3 class="card-title">Dernières commandes</h3>
                  <p class="card-subtitle">Les plus récentes</p>
                </div>
                <a href="commandes.html" class="btn btn-secondary btn-sm">Voir tout</a>
              </div>
              <div class="table-wrapper">
                <table class="admin-table">
                  <thead>
                    <tr>
                      <th>N° commande</th>
                      <th>Client</th>
                      <th>Date</th>
                      <th>Total</th>
                      <th>Statut</th>
                    </tr>
                  </thead>
                  <tbody id="recentOrders"></tbody>
                </table>
              </div>
            </div>
          </div>

          <div class="alert alert-warning" id="lowStockAlert" style="display:none">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
            <div>
              <strong>Stock faible</strong>
              <span id="lowStockText"></span> <a href="stock.html" style="color:inherit;text-decoration:underline;font-weight:600">Gérer le stock →</a>
            </div>
          </div>
        `;

        function methodLabel(m) {
          const map = { card: 'Carte bancaire', paypal: 'PayPal', cod: 'Paiement à la livraison', bank_transfer: 'Virement', mobile_money: 'Mobile Money' };
          return map[m] || (m ? String(m).replace('_', ' ') : '—');
        }

        function render() {
          document.getElementById('statRevenue').textContent = formatPrice(stats.revenue || 0);
          document.getElementById('statOrders').textContent = stats.orders || 0;
          document.getElementById('statProducts').textContent = stats.products || 0;
          document.getElementById('statCustomers').textContent = stats.customers || 0;

          // Répartition par statut
          const count = {};
          orders.forEach(o => { count[o.status] = (count[o.status] || 0) + 1; });
          const total = orders.length;
          const order = ['pending', 'processing', 'shipped', 'delivered', 'cancelled', 'refunded'];
          document.getElementById('orderStatusList').innerHTML = order
            .filter(s => count[s])
            .map(s => {
              const m = orderStatusMap[s] || orderStatusMap.pending;
              return `
                <div class="status-item">
                  <span class="status-dot ${m.badge.replace('badge-', 'dot-')}"></span>
                  <div style="flex:1">
                    <div style="display:flex;justify-content:space-between">
                      <span style="font-size:0.9rem">${m.label}</span>
                      <strong style="font-size:0.9rem">${count[s]}</strong>
                    </div>
                    <div style="height:6px;background:var(--bg-primary);border-radius:999px;margin-top:8px">
                      <div style="height:100%;border-radius:999px;background:var(--accent-green);width:${total ? Math.round((count[s] / total) * 100) : 0}%"></div>
                    </div>
                  </div>
                </div>
              `;
            }).join('') || '<div class="empty-state"><p>Aucune commande.</p></div>';

          // Dernières commandes
          const tbody = document.getElementById('recentOrders');
          tbody.innerHTML = [...orders]
            .sort((a, b) => new Date(b.created_at) - new Date(a.created_at))
            .slice(0, 6)
            .map(o => {
              const st = orderStatusMap[o.status] || orderStatusMap.pending;
              const email = (o.user && o.user.email) || '—';
              return `
                <tr>
                  <td><a href="commandes.html" class="price-text" style="color:var(--accent-green)">${o.order_number}</a></td>
                  <td><strong style="font-size:0.88rem">${email}</strong></td>
                  <td style="color:var(--text-secondary)">${formatDate(o.created_at)}</td>
                  <td class="price-text">${formatPrice(o.grand_total)}</td>
                  <td><span class="badge ${st.badge}">${st.label}</span></td>
                </tr>
              `;
            }).join('') || '<tr><td colspan="5"><div class="empty-state"><p>Aucune commande.</p></div></td></tr>';

          if (stats.lowStock > 0) {
            document.getElementById('lowStockAlert').style.display = 'flex';
            document.getElementById('lowStockText').textContent = `${stats.lowStock} produit(s) atteignent le seuil de stock bas.`;
          }
        }

        async function load() {
          stats = await adminDB.dashboardStats();
          orders = await adminDB.orders();
          products = await adminDB.products();
          render();
        }

        adminGate(content, load);
      });
    </script>

  </body>
</html>
