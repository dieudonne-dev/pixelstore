<!DOCTYPE html>
<html lang="fr" data-theme="light">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catégories — PixelStore Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="css/admin.css">
  </head>
  <body>

    <script src="js/admin-config.js"></script>
    <script src="js/admin-supabase.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/admin.js"></script>

    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const content = renderAdminLayout('categories');

        let categories = [];
        let products = [];
        let editingId = null;
        let pendingDeleteId = null;

        content.innerHTML = `
          <div class="page-breadcrumb">
            <a href="index.html">${ICONS.home} Tableau de bord</a>
            <span>/</span>
            <span>Catégories</span>
          </div>

          <div class="page-header">
            <div>
              <h1 class="page-title">Catégories</h1>
              <p class="page-subtitle">Organisez votre catalogue en catégories et sous-catégories.</p>
            </div>
            <button class="btn btn-primary" id="addCategoryBtn">+ Nouvelle catégorie</button>
          </div>

          <div class="dashboard-grid" style="grid-template-columns:1fr 1fr;align-items:start">
            <div class="card">
              <div class="card-header">
                <h3 class="card-title">Catégories existantes</h3>
              </div>
              <div id="categoriesList"></div>
            </div>

            <div class="card">
              <div class="card-header">
                <h3 class="card-title" id="formTitle">Ajouter une catégorie</h3>
              </div>
              <form id="categoryForm">
                <div class="form-group" style="margin-bottom:14px">
                  <label for="cName">Nom de la catégorie <span class="required">*</span></label>
                  <input type="text" id="cName" placeholder="Ex : Composants">
                </div>
                <div class="form-group" style="margin-bottom:14px">
                  <label for="cSlug">Slug <span class="hint">auto-généré si vide</span></label>
                  <input type="text" id="cSlug" placeholder="composants">
                </div>
                <div class="form-group" style="margin-bottom:18px">
                  <label>Active en boutique</label>
                  <label class="switch" style="margin-top:8px">
                    <input type="checkbox" id="cActive" checked>
                    <span class="slider"></span>
                  </label>
                </div>
                <div class="form-actions" style="margin-top:0;padding-top:0;border:none">
                  <button type="submit" class="btn btn-primary" id="saveCategoryBtn">Ajouter la catégorie</button>
                  <button type="button" class="btn btn-ghost" id="cancelEditBtn" style="display:none">Annuler</button>
                </div>
              </form>
            </div>
          </div>

          <div class="modal-backdrop" id="deleteModal">
            <div class="modal">
              <div class="modal-header">
                <h3>Supprimer la catégorie</h3>
                <button class="modal-close" id="deleteModalClose" aria-label="Fermer">
                  <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
              </div>
              <p style="font-size:0.92rem;color:var(--text-secondary)">Voulez-vous vraiment supprimer <strong id="deleteName" style="color:var(--text-primary)"></strong> ? Cette action est irréversible.</p>
              <div class="modal-footer">
                <button class="btn btn-ghost" id="cancelDelete">Annuler</button>
                <button class="btn btn-danger" id="confirmDelete">Supprimer</button>
              </div>
            </div>
          </div>
        `;

        const listEl = document.getElementById('categoriesList');
        const deleteModal = document.getElementById('deleteModal');

        function renderCategories() {
          listEl.innerHTML = categories.map(c => {
            const count = products.filter(p => p.category === c.slug).length;
            return `
              <div class="status-item">
                <span class="status-dot ${c.is_active ? 'dot-green' : 'dot-gray'}"></span>
                <div style="flex:1">
                  <strong style="font-size:0.9rem">${c.name}</strong>
                  <span style="font-size:0.78rem;color:var(--text-secondary)">${count} produit(s)</span>
                </div>
                <button class="btn btn-secondary btn-icon btn-edit-cat" data-id="${c.id}" title="Modifier">
                  <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 3a2.83 2.83 0 0 1 4 4L7.5 20.5 2 22l1.5-5.5z"></path></svg>
                </button>
                <button class="btn btn-danger btn-icon btn-delete-cat" data-id="${c.id}" title="Supprimer">
                  <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                </button>
              </div>
            `;
          }).join('') || '<div class="empty-state"><p>Aucune catégorie.</p></div>';
        }

        function resetForm() {
          editingId = null;
          document.getElementById('formTitle').textContent = 'Ajouter une catégorie';
          document.getElementById('cName').value = '';
          document.getElementById('cSlug').value = '';
          document.getElementById('cActive').checked = true;
          document.getElementById('saveCategoryBtn').textContent = 'Ajouter la catégorie';
          document.getElementById('cancelEditBtn').style.display = 'none';
        }

        function fillForm(cat) {
          editingId = cat.id;
          document.getElementById('formTitle').textContent = 'Modifier la catégorie';
          document.getElementById('cName').value = cat.name;
          document.getElementById('cSlug').value = cat.slug;
          document.getElementById('cActive').checked = cat.is_active;
          document.getElementById('saveCategoryBtn').textContent = 'Enregistrer les modifications';
          document.getElementById('cancelEditBtn').style.display = 'inline-flex';
        }

        document.getElementById('addCategoryBtn').addEventListener('click', resetForm);

        document.getElementById('categoryForm').addEventListener('submit', async (e) => {
          e.preventDefault();
          const name = document.getElementById('cName').value.trim();
          if (!name) { showToast('Le nom de la catégorie est obligatoire.', 'error'); return; }
          const slug = document.getElementById('cSlug').value.trim() || adminDB.slugify(name);
          try {
            await adminDB.saveCategory({
              id: editingId,
              name,
              slug,
              is_active: document.getElementById('cActive').checked
            });
            showToast(editingId ? 'Catégorie mise à jour.' : 'Catégorie créée.');
            resetForm();
            await load();
          } catch (err) {
            showToast((err && err.message) || 'Erreur lors de l\'enregistrement.', 'error');
          }
        });

        listEl.addEventListener('click', (e) => {
          const editBtn = e.target.closest('.btn-edit-cat');
          const delBtn = e.target.closest('.btn-delete-cat');
          if (editBtn) {
            const cat = categories.find(c => c.id === parseInt(editBtn.dataset.id, 10));
            if (cat) fillForm(cat);
          }
          if (delBtn) {
            pendingDeleteId = parseInt(delBtn.dataset.id, 10);
            const cat = categories.find(c => c.id === pendingDeleteId);
            document.getElementById('deleteName').textContent = cat ? cat.name : '';
            deleteModal.classList.add('open');
          }
        });

        document.getElementById('confirmDelete').addEventListener('click', async () => {
          try {
            await adminDB.deleteCategory(pendingDeleteId);
            showToast('Catégorie supprimée.');
            await load();
          } catch (err) {
            showToast((err && err.message) || 'Suppression impossible.', 'error');
          }
          deleteModal.classList.remove('open');
          pendingDeleteId = null;
        });

        document.getElementById('cancelEditBtn').addEventListener('click', resetForm);
        document.getElementById('deleteModalClose').addEventListener('click', () => deleteModal.classList.remove('open'));
        document.getElementById('cancelDelete').addEventListener('click', () => deleteModal.classList.remove('open'));
        deleteModal.addEventListener('click', (e) => { if (e.target === deleteModal) deleteModal.classList.remove('open'); });

        async function load() {
          categories = await adminDB.categories();
          products = await adminDB.products();
          renderCategories();
        }

        adminGate(content, load);
      });
    </script>

  </body>
</html>
