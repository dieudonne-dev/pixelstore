<!DOCTYPE html>
<html lang="fr" data-theme="light">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messages — PixelStore Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="css/admin.css">
  </head>
  <body>

    <script src="js/admin-config.js"></script>
    <script src="js/admin-supabase.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/admin.js"></script>

    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const content = renderAdminLayout('contacts');

        let contacts = [];
        let stats = { total: 0, unread: 0, thisMonth: 0 };
        let page = 1;
        const pageSize = 20;
        let search = '';
        let pendingDeleteId = null;
        let viewingContact = null;

        content.innerHTML = `
          <div class="page-breadcrumb">
            <a href="index.html">${ICONS.home} Tableau de bord</a>
            <span>/</span>
            <span>Messages</span>
          </div>

          <div class="page-header">
            <div>
              <h1 class="page-title">Messages de contact</h1>
              <p class="page-subtitle">Consultez les messages envoyés via le formulaire de contact.</p>
            </div>
            <div class="topbar-search" style="max-width:280px">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
              <input type="text" id="searchInput" placeholder="Rechercher par nom ou email...">
            </div>
          </div>

          <div class="stats-row" id="statsRow">
            <div class="stat-mini">
              <div class="stat-mini-value" id="statTotal">-</div>
              <div class="stat-mini-label">Total messages</div>
            </div>
            <div class="stat-mini">
              <div class="stat-mini-value" id="statUnread">-</div>
              <div class="stat-mini-label">Non lus</div>
            </div>
            <div class="stat-mini">
              <div class="stat-mini-value" id="statMonth">-</div>
              <div class="stat-mini-label">Ce mois-ci</div>
            </div>
          </div>

          <div class="table-wrapper">
            <table class="admin-table">
              <thead>
                <tr>
                  <th style="width:30px"></th>
                  <th>Nom</th>
                  <th>Email</th>
                  <th>Sujet</th>
                  <th>Date</th>
                  <th style="text-align:right">Actions</th>
                </tr>
              </thead>
              <tbody id="contactsBody"></tbody>
            </table>
          </div>

          <div style="display:flex;justify-content:space-between;align-items:center;margin-top:16px">
            <span class="hint" id="pageInfo"></span>
            <div style="display:flex;gap:6px">
              <button class="btn btn-secondary btn-sm" id="prevPage" disabled>← Précédent</button>
              <button class="btn btn-secondary btn-sm" id="nextPage" disabled>Suivant →</button>
            </div>
          </div>

          <!-- Modal lecture message -->
          <div class="modal-backdrop" id="viewModal">
            <div class="modal" style="max-width:600px">
              <div class="modal-header">
                <h3 id="viewSubject">Message</h3>
                <button class="modal-close" id="viewModalClose" aria-label="Fermer">
                  <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
              </div>
              <div style="margin-bottom:16px">
                <div style="display:flex;gap:16px;font-size:0.85rem;color:var(--text-secondary);margin-bottom:12px">
                  <span><strong>De :</strong> <span id="viewName"></span></span>
                  <span><strong>Email :</strong> <span id="viewEmail"></span></span>
                </div>
                <div style="font-size:0.82rem;color:var(--text-muted);margin-bottom:8px" id="viewDate"></div>
                <div style="padding:16px;background:var(--bg-primary);border-radius:8px;line-height:1.6;white-space:pre-wrap;font-size:0.92rem;color:var(--text-primary)" id="viewMessage"></div>
              </div>
              <div class="modal-footer">
                <button class="btn btn-ghost" id="viewCloseBtn">Fermer</button>
                <button class="btn btn-secondary" id="viewToggleRead">Marquer comme lu</button>
              </div>
            </div>
          </div>

          <!-- Modal suppression -->
          <div class="modal-backdrop" id="deleteModal">
            <div class="modal">
              <div class="modal-header">
                <h3>Supprimer le message</h3>
                <button class="modal-close" id="deleteModalClose" aria-label="Fermer">
                  <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
              </div>
              <p style="font-size:0.92rem;color:var(--text-secondary)">Voulez-vous vraiment supprimer ce message ?</p>
              <div class="modal-footer">
                <button class="btn btn-ghost" id="cancelDelete">Annuler</button>
                <button class="btn btn-danger" id="confirmDelete">Supprimer</button>
              </div>
            </div>
          </div>
        `;

        const tbody = document.getElementById('contactsBody');
        const viewModal = document.getElementById('viewModal');
        const deleteModal = document.getElementById('deleteModal');

        function formatDate(d) {
          if (!d) return '-';
          return new Date(d).toLocaleDateString('fr-FR', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
        }

        function truncate(s, len) {
          if (!s) return '';
          return s.length > len ? s.substring(0, len) + '...' : s;
        }

        function renderStats() {
          document.getElementById('statTotal').textContent = stats.total;
          document.getElementById('statUnread').textContent = stats.unread;
          document.getElementById('statMonth').textContent = stats.thisMonth;
        }

        function renderContacts() {
          const filtered = search
            ? contacts.filter(c =>
                c.name.toLowerCase().includes(search) ||
                c.email.toLowerCase().includes(search) ||
                (c.subject || '').toLowerCase().includes(search))
            : contacts;

          tbody.innerHTML = filtered.map(c => `
            <tr class="${!c.isRead ? 'row-unread' : ''}" style="${!c.isRead ? 'font-weight:500' : ''}">
              <td>${!c.isRead ? '<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent-blue)"></span>' : ''}</td>
              <td>${c.name}</td>
              <td>${c.email}</td>
              <td>${truncate(c.subject, 40) || '<span class="hint">-</span>'}</td>
              <td>${formatDate(c.createdAt)}</td>
              <td>
                <div style="display:flex;gap:6px;justify-content:flex-end">
                  <button class="btn btn-secondary btn-icon btn-view-contact" data-id="${c.id}" title="Lire le message">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                  </button>
                  <button class="btn btn-secondary btn-icon btn-toggle-read" data-id="${c.id}" data-read="${c.isRead}" title="${c.isRead ? 'Marquer non lu' : 'Marquer lu'}">
                    ${c.isRead
                      ? '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>'
                      : '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>'
                    }
                  </button>
                  <button class="btn btn-danger btn-icon btn-delete-contact" data-id="${c.id}" title="Supprimer">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                  </button>
                </div>
              </td>
            </tr>
          `).join('') || '<tr><td colspan="6"><div class="empty-state"><h3>Aucun message</h3><p>Les messages envoyés via le formulaire de contact apparaîtront ici.</p></div></td></tr>';

          document.getElementById('pageInfo').textContent = `Page ${page} — ${filtered.length} message(s)`;
          document.getElementById('prevPage').disabled = page <= 1;
          document.getElementById('nextPage').disabled = contacts.length < pageSize;
        }

        function openView(c) {
          viewingContact = c;
          document.getElementById('viewSubject').textContent = c.subject || 'Message sans sujet';
          document.getElementById('viewName').textContent = c.name;
          document.getElementById('viewEmail').textContent = c.email;
          document.getElementById('viewDate').textContent = formatDate(c.createdAt);
          document.getElementById('viewMessage').textContent = c.message;
          document.getElementById('viewToggleRead').textContent = c.isRead ? 'Marquer non lu' : 'Marquer lu';
          viewModal.classList.add('open');

          if (!c.isRead) {
            adminDB.markContactRead(c.id, true).then(() => load());
          }
        }

        tbody.addEventListener('click', async (e) => {
          const viewBtn = e.target.closest('.btn-view-contact');
          const toggleBtn = e.target.closest('.btn-toggle-read');
          const deleteBtn = e.target.closest('.btn-delete-contact');
          if (viewBtn) {
            const c = contacts.find(x => x.id === parseInt(viewBtn.dataset.id, 10));
            if (c) openView(c);
          }
          if (toggleBtn) {
            const id = parseInt(toggleBtn.dataset.id, 10);
            const isRead = toggleBtn.dataset.read === 'true';
            try {
              await adminDB.markContactRead(id, !isRead);
              showToast(isRead ? 'Marqué non lu.' : 'Marqué lu.');
              await load();
            } catch (err) { showToast('Erreur.', 'error'); }
          }
          if (deleteBtn) {
            pendingDeleteId = parseInt(deleteBtn.dataset.id, 10);
            deleteModal.classList.add('open');
          }
        });

        document.getElementById('viewModalClose').addEventListener('click', () => viewModal.classList.remove('open'));
        document.getElementById('viewCloseBtn').addEventListener('click', () => viewModal.classList.remove('open'));
        viewModal.addEventListener('click', (e) => { if (e.target === viewModal) viewModal.classList.remove('open'); });

        document.getElementById('viewToggleRead').addEventListener('click', async () => {
          if (!viewingContact) return;
          try {
            await adminDB.markContactRead(viewingContact.id, !viewingContact.isRead);
            viewingContact.isRead = !viewingContact.isRead;
            document.getElementById('viewToggleRead').textContent = viewingContact.isRead ? 'Marquer non lu' : 'Marquer lu';
            showToast(viewingContact.isRead ? 'Marqué lu.' : 'Marqué non lu.');
            await load();
          } catch (err) { showToast('Erreur.', 'error'); }
        });

        document.getElementById('confirmDelete').addEventListener('click', async () => {
          try {
            await adminDB.deleteContact(pendingDeleteId);
            showToast('Message supprimé.');
            deleteModal.classList.remove('open');
            await load();
          } catch (err) { showToast('Suppression impossible.', 'error'); }
          pendingDeleteId = null;
        });

        document.getElementById('deleteModalClose').addEventListener('click', () => deleteModal.classList.remove('open'));
        document.getElementById('cancelDelete').addEventListener('click', () => deleteModal.classList.remove('open'));
        deleteModal.addEventListener('click', (e) => { if (e.target === deleteModal) deleteModal.classList.remove('open'); });
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { viewModal.classList.remove('open'); deleteModal.classList.remove('open'); } });

        document.getElementById('searchInput').addEventListener('input', (e) => {
          search = e.target.value.trim().toLowerCase();
          renderContacts();
        });

        document.getElementById('prevPage').addEventListener('click', () => { if (page > 1) { page--; load(); } });
        document.getElementById('nextPage').addEventListener('click', () => { page++; load(); });

        async function load() {
          try {
            [contacts, stats] = await Promise.all([
              adminDB.contacts({ page, pageSize }),
              adminDB.contactStats()
            ]);
            renderStats();
            renderContacts();
          } catch (err) {
            showToast('Erreur de chargement.', 'error');
          }
        }

        adminGate(content, load);
      });
    </script>

  </body>
</html>
